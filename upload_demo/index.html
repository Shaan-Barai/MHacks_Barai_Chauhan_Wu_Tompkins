<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrapSaver</title>
<style>
  :root { --bg: #f6f5f1; --ink: #1b1b1a; --accent: #1f7a4d; --err: #a3271b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { text-align: center; padding: 16px; }
  button { font: inherit; font-size: 22px; font-weight: 600; padding: 18px 40px; border-radius: 12px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 3px solid #7cc3a0; outline-offset: 3px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #fff; border-right-color: transparent; border-radius: 50%;
             animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { color: var(--err); margin-top: 16px; min-height: 24px; }
</style>
</head>
<body>
<main>
  <button id="upload" type="button">Upload a photo</button>
  <input type="file" id="file" accept="image/*" hidden>
  <p id="error" role="alert"></p>
</main>
<script>
const button = document.getElementById('upload');
const input = document.getElementById('file');
const error = document.getElementById('error');

/** Re-encode in the browser: applies EXIF rotation, decodes HEIC in Safari, and keeps uploads small. */
async function toJpeg(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92));
  } catch {
    return file; // let the server try
  }
}

button.addEventListener('click', () => input.click());
input.addEventListener('change', async () => {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  error.textContent = '';
  button.disabled = true;
  button.innerHTML = '<span class="spinner"></span>Analyzing…';
  try {
    const blob = await toJpeg(file);
    const res = await fetch('/api/analyze', { method: 'POST', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
    const body = await res.json().catch(() => ({ error: { message: `Server error ${res.status}` } }));
    if (!res.ok) throw new Error(body.error?.message ?? `Server error ${res.status}`);
    location.href = `/results/${body.id}`;
  } catch (err) {
    error.textContent = err.message;
    button.disabled = false;
    button.textContent = 'Upload a photo';
  }
});
</script>
</body>
</html>
